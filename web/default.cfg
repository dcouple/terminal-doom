# chocolate-doom config for terminal-doom.
#
# Keys are DOS scancodes. The bindings below are the modern shape people expect
# — WASD to move, arrows to turn, ctrl to fire, space to open — rather than
# doom's 1993 defaults, because most people meeting this in a terminal have
# never played with the original layout.
use_libsamplerate              0
# The software renderer draws through canvas 2d instead of webgl, which is what
# terminal-browser can actually read pixels back from. Doom is 320x200; the cost
# is nothing.
force_software_renderer        1
startup_delay                  0
show_diskicon                  0
grabmouse                      0
fullscreen                     0
sfx_volume                     8
music_volume                   0
show_messages                  1

key_up                         17
key_down                       31
key_strafeleft                 30
key_straferight                32
key_left                       75
key_right                      77
key_fire                       29
key_use                        57
key_strafe                     56
key_speed                      42
key_strafe_alt                 56
key_speed_alt                  42
key_fullscreen                 0

use_mouse                      1
mouse_sensitivity              5
use_joystick                   0
screenblocks                   10
detaillevel                    0
snd_channels                   8
snd_musicdevice                0
snd_sfxdevice                  3
